# legal-anglicana-r4 — medieval Latin legal hands (14th-c. English plea rolls).
# Narrower coverage than general models; higher quality on target domain.
name: legal-anglicana-r4
kind: htr
path: "${LATIN_MS_WORKSPACE}/training/htr_latin_updated_best.mlmodel"
size_mb: 24

languages: [lat-Latn]
eras: [medieval]
scripts: [anglicana_cursiva]
era_range: "1280-1420"

training:
  base_model: medieval-broad-r2
  round: 4
  date: 2026-05-14
  corpora: [cremma-medieval, justice-rolls-curated]
  hyperparams:
    learning_rate: 0.00001
    augment: true

metrics:
  val_cer: 0.1595
  per_corpus_cer:
    tridis: 0.2990
    catmus-medieval: null
  notes: |
    Primary test corpus: JUST1, KB27, CP40 rolls. Tridis OOD CER 29.90% confirms
    the specialisation trade-off — narrower hand coverage, materially better on
    target than the broader medieval-broad-r2.
