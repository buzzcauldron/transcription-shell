# Document type: Byzantine / medieval Greek minuscule books
# Polytonic Greek codices (gospel books, anthologies, Psellos, etc.), 9th–16th c.
name: medieval_greek_minuscule
language: grc-Grek
era: byzantine
era_range: "800-1600"
script: greek_minuscule

llm:
  primary: claude-sonnet-4
  fallback: gemini-2.5-pro

htr:
  # Prefer Bridges fine-tune; fallback PTA 9–12c seed (Zenodo 15838142).
  model: gm-htr-greek-minuscule
  path: "${HOME}/src/gm-htr-greek-minuscule_best.mlmodel"
  fallback_path: "${HOME}/src/greek_minuscule_s9-12_NFC.mlmodel"

segmentation:
  model: kraken-merged-seg_best

prompt: prompt_ancient_greek.yaml

notes: >
  GT: eparchos, stavronikita-*, palatine-anthology-cpgr23, hpgtr (NC), optional
  vat-gr-2228-phil-gr-130 (images via IIIF). Classical *content* may appear in
  Byzantine hands (e.g. Palatine Anthology, Sextus LJS380) — still this script type.
  Train NFC polytonic. See docs/greek-htr-training-data.md.
