name: gm-htr-r7-full_best
kind: htr
path: "${HOME}/src/latin_documents/gm-htr-r7-full_best.mlmodel"
size_mb: 24

languages: [lat-Latn, fra-Latn, eng-Latn]
eras: [medieval, early_modern]
scripts: [caroline_minuscule, protogothic, pregothic, insular_minuscule, anglicana_cursiva, gothic_cursiva, humanist_italic_mixed]
era_range: "500-1700"

training:
  base_model: gm-htr-r6-core_best
  round: 7
  date: 2026-07-01
  corpora: [carolingian-latin-2025, carolingian-latin-vienna, catmus-medieval, cremma-medieval-lat, paris-bible, eutyches, konigsfelden-charters, bullinger-htr]
  hyperparams:
    learning_rate: 0.00001
    batch_size: 16
    schedule: cosine
  notes: "Bridges r7-full retrain; full regularized corpus with Bullinger when present."

metrics:
  notes: >
    Bridges r6/r7 pipeline export. No published val_accuracy / per_corpus_cer —
    demoted from "best general" claims until score-htr-per-corpus is run.
  recommend_correct_mode: false
  held_out_ready: false
