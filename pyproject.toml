[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dendro-shell"
version = "0.1.0"
description = "Path-first tree-ring tracing, hard-image presets, chronology export, and in-app U-Net training"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dendro-shell contributors" }]
dependencies = [
  "numpy>=1.26.0",
  "pillow>=10.0.0",
  "scipy>=1.11.0",
  "opencv-python-headless>=4.9.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
]

[project.optional-dependencies]
ui = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.9",
]
train = [
  "torch>=2.0.0",
  "albumentations>=1.4.0",
]
viz = ["matplotlib>=3.8.0"]
dev = ["pytest>=8.0", "httpx>=0.27.0"]
all = ["dendro-shell[ui,train,viz,dev]"]

[project.scripts]
dendro = "dendro_shell.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dendro_shell"]

[tool.hatch.build.targets.wheel.sources]
"src/dendro_shell" = "dendro_shell"

[tool.hatch.build.targets.sdist]
include = ["src/dendro_shell", "README.md", "tests", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
